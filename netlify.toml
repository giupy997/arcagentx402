# Netlify hosts only the website (landing + network page). The API and collector run on the VPS.
# Point the pages at the API with CRA_API_URL (Site configuration > Environment variables),
# e.g. https://api.example.com. Without it the landing is static and /network shows a placeholder.

[build]
  command = "npm run web:build"
  publish = "packages/web/dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/network"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/token"
  to = "/token.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/network"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/try"
  to = "/try.html"
  status = 200

[[redirects]]
  from = "/status"
  to = "/status.html"
  status = 200

[[redirects]]
  from = "/factory"
  to = "/factory.html"
  status = 200

[[redirects]]
  from = "/market"
  to = "/market.html"
  status = 200

[[redirects]]
  from = "/lane"
  to = "/lane.html"
  status = 200

[[redirects]]
  from = "/register"
  to = "/register.html"
  status = 200

[[redirects]]
  from = "/think"
  to = "/think.html"
  status = 200
